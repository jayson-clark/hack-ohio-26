<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fireline Prompter</title>
<!--
  Karaoke prompter for the demo video's voiceover. Reads the "Read-along" table
  in SCRIPT.md (same folder), so the script stays the one source. Serve it with
  `make prompter`; fetch() can't read SCRIPT.md from a file:// page.

  Record mode (K): records the voiceover one line at a time with a 1-2-3
  count-in, grouped into three thirds with a pause between each, and lets you
  re-take any single line. "Save clips" downloads one audio file per line plus a
  manifest; tools/demo_video/stitch_vo.py places each at its cue start to render
  one cohesive 3:00 track. The mic needs a secure context, which 127.0.0.1 is.
-->
<style>
  :root {
    --bg: #0d0f11; --panel: #16191d; --edge: #262b31;
    --ink: #f2f4f6; --dim: #6b737c; --faint: #3a4047;
    --lit: #ffb547; --accent: #5b8cff; --warn: #ff6b5b;
    --size: 44px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    display: grid; grid-template-rows: auto 1fr auto; overflow: hidden;
  }
  header, footer { display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: var(--panel); border-color: var(--edge); }
  header { border-bottom: 1px solid var(--edge); }
  footer { border-top: 1px solid var(--edge); flex-wrap: wrap; }
  .clock { font: 600 28px/1 ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }
  .clock small { color: var(--dim); font-size: 16px; }
  .state { color: var(--dim); font-size: 14px; }
  .state.live { color: var(--lit); }
  .grow { flex: 1; }
  button {
    background: var(--bg); color: var(--ink); border: 1px solid var(--edge); border-radius: 8px;
    padding: 8px 12px; font: inherit; font-size: 14px; cursor: pointer;
  }
  button:hover { border-color: var(--dim); }
  .hint { color: var(--dim); font-size: 13px; }
  kbd { font: 12px ui-monospace, Menlo, monospace; color: var(--dim); border: 1px solid var(--edge); border-radius: 4px; padding: 1px 5px; }
  .bar { position: relative; height: 6px; background: var(--faint); border-radius: 3px; flex-basis: 100%; cursor: pointer; }
  .bar .fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 3px; }
  .bar .tick { position: absolute; top: -3px; width: 1px; height: 12px; background: var(--dim); }

  main { overflow: hidden; position: relative; }
  .lines { padding: 40vh 8vw; transition: transform 0.35s ease; }
  .line { margin: 0 0 0.9em; font-size: calc(var(--size) * 0.62); line-height: 1.3; color: var(--faint); cursor: pointer; }
  .line .time { display: block; font: 13px ui-monospace, Menlo, monospace; color: var(--faint); margin-bottom: 4px; }
  .line.near { color: var(--dim); }
  .line.current { font-size: var(--size); color: var(--ink); }
  .line.current .time { color: var(--dim); }
  .line .w { transition: color 0.12s; }
  .line.current .w.lit { color: var(--lit); }
  .line.done { color: var(--faint); }
  .progress { height: 4px; margin-top: 10px; background: var(--faint); border-radius: 2px; overflow: hidden; display: none; }
  .line.current .progress { display: block; }
  .progress div { height: 100%; width: 0; background: var(--lit); }

  .cue { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; max-width: 70ch; }
  .cue dt { color: var(--dim); }
  .cue dd { margin: 0; }
  .next { color: var(--dim); font-size: 14px; }
  .next b { color: var(--ink); font-variant-numeric: tabular-nums; }

  .count { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; font: 700 30vh/1 -apple-system, sans-serif; color: var(--lit); background: rgba(13, 15, 17, 0.75); }
  .count.on { display: flex; }
  .error { padding: 10vh 8vw; font-size: 20px; color: var(--warn); }
  .error code { color: var(--ink); }

  .seg { color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; }
  .seg b { color: var(--ink); }
  #rec[aria-pressed="true"] { border-color: var(--warn); color: var(--warn); }
  body.recording #rec { background: var(--warn); color: #0d0f11; border-color: var(--warn); }
  .state.rec { color: var(--warn); }
  /* a small dot on lines that already have a take */
  .line .time::after { content: ""; }
  .line.has-clip .time::after { content: " ● recorded"; color: #46c46a; }
  .line.current.has-clip .time::after { color: #46c46a; }
  /* segment banner shown between thirds */
  .banner { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; background: rgba(13, 15, 17, 0.9); padding: 0 8vw; }
  .banner.on { display: flex; }
  .banner h2 { margin: 0; font-size: 4vh; color: var(--lit); }
  .banner p { margin: 0; color: var(--dim); font-size: 2.2vh; }

  @media (max-width: 640px) {
    :root { --size: 30px; }
    header, footer { padding: 10px 16px; gap: 10px; }
    .lines { padding: 35vh 16px; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="clock"><span id="now">0:00.0</span> <small>/ <span id="total">0:00</span></small></div>
  <div class="state" id="state">Ready · Space to start</div>
  <div class="grow"></div>
  <div class="next" id="next"></div>
</header>
<main>
  <div class="lines" id="lines"></div>
  <div class="count" id="count"></div>
  <div class="banner" id="banner">
    <h2 id="bannerTitle"></h2>
    <p id="bannerBody"></p>
  </div>
</main>
<footer>
  <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
  <dl class="cue">
    <dt>Picture</dt><dd id="picture">–</dd>
    <dt>On screen</dt><dd id="onscreen">–</dd>
  </dl>
  <div class="grow"></div>
  <span class="seg" id="seg"></span>
  <button id="prev" title="Previous line">←</button>
  <button id="play" title="Play / record the current line">Start</button>
  <button id="nextBtn" title="Next line">→</button>
  <button id="rec" title="Record mode: read one line per take with a 1-2-3 count-in" aria-pressed="false">● Record: off</button>
  <button id="save" title="Download every recorded line clip + manifest.json (spaced out)">Save clips</button>
  <button id="saveNext" title="Save one clip at a time (if the browser blocks the batch)">Save next</button>
  <button id="srt">Captions (.srt)</button>
  <span class="hint"><kbd>Space</kbd> play/record · <kbd>←</kbd><kbd>→</kbd> lines · <kbd>R</kbd> restart · <kbd>+</kbd><kbd>−</kbd> size · <kbd>C</kbd> count-in · <kbd>K</kbd> record mode</span>
</footer>
<script>
const COUNT_IN_S = 3;
const $ = (id) => document.getElementById(id);
let cues = [], total = 0;
let t = 0;               // script time, seconds
let running = false, lastFrame = 0, countIn = true, counting = null;

// --- Recording (line-by-line) ---------------------------------------------
// In record mode you read one line per take: a 1-2-3 count-in, the line's
// karaoke fill plays over its cue window, then the take auto-stops and parks on
// the next line. Re-reading a line overwrites its clip. The 20 cues are grouped
// into thirds; the prompter pauses with a banner between groups so you can
// breathe. "Save clips" downloads every take + a manifest; stitch_vo.py places
// each clip at its cue start to render one cohesive 3:00 track.
let recordMode = false;      // whether we're in line-by-line record mode
let mediaStream = null;      // the mic stream (requested once)
let recorder = null;         // the active MediaRecorder, or null
let recChunks = [];          // chunks for the take in progress
let recIndex = -1;           // cue index currently being recorded
const clips = {};            // index -> { blob, dur } of recorded takes
let segStarts = [];          // cue indices that begin each third (e.g. [0, 7, 13])
let recMime = "audio/webm";  // chosen MediaRecorder mime

const toSec = (s) => { const [m, sec] = s.split(":"); return Number(m) * 60 + Number(sec); };
const fmt = (s, tenths = true) => {
  const m = Math.floor(s / 60), r = s - m * 60;
  return `${m}:${tenths ? r.toFixed(1).padStart(4, "0") : String(Math.floor(r)).padStart(2, "0")}`;
};
const plain = (s) => s.replace(/`/g, "").replace(/\*\*/g, "").trim();

function parse(md) {
  const part = md.split(/^## Read-along\s*$/m)[1];
  if (!part) throw new Error("SCRIPT.md has no \"## Read-along\" section");
  const rows = part.split(/^## /m)[0].split("\n").filter((l) => /^\|\s*\d+:\d\d/.test(l));
  return rows.map((r) => {
    const c = r.replace(/^\||\|$/g, "").split("|").map((x) => plain(x));
    return { start: toSec(c[0]), end: toSec(c[1]), picture: c[2] || "–", line: c[3] || "", onscreen: c[4] || "–" };
  });
}

// Group the cues into three roughly equal thirds. A third begins at the cue
// whose start is nearest 1/3 and 2/3 of the total, so breaks fall on line
// boundaries. Returns the cue indices that start each group, e.g. [0, 7, 13].
function computeSegments() {
  const nearestStart = (target) => {
    let best = 0, bestD = Infinity;
    cues.forEach((c, i) => { const d = Math.abs(c.start - target); if (d < bestD) { bestD = d; best = i; } });
    return best;
  };
  const a = nearestStart(total / 3), b = nearestStart((2 * total) / 3);
  // Guard against degenerate scripts: keep strictly increasing, skip 0.
  return [0, a, b].filter((v, i, xs) => i === 0 || v > xs[i - 1]);
}
const segOf = (i) => { let s = 0; for (let k = 0; k < segStarts.length; k++) if (i >= segStarts[k]) s = k; return s; };
const segLastIndex = (seg) => (seg + 1 < segStarts.length ? segStarts[seg + 1] - 1 : cues.length - 1);

// Each word lights when the time spent reading the words before it has passed.
// Longer words take longer to say, so the share is by letters, not by count.
function build() {
  const box = $("lines");
  box.innerHTML = "";
  cues.forEach((c, i) => {
    const el = document.createElement("div");
    el.className = "line";
    el.innerHTML = `<span class="time">${fmt(c.start, false)}–${fmt(c.end, false)}</span>`;
    const words = c.line.split(/\s+/).filter(Boolean);
    const weights = words.map((w) => w.replace(/[^\p{L}\p{N}]/gu, "").length + 2);
    const sum = weights.reduce((a, b) => a + b, 0);
    let acc = 0;
    c.at = [];
    words.forEach((w, j) => {
      const span = document.createElement("span");
      span.className = "w";
      span.textContent = w + " ";
      el.appendChild(span);
      c.at.push(c.start + (acc / sum) * (c.end - c.start));
      acc += weights[j];
    });
    const prog = document.createElement("div");
    prog.className = "progress";
    prog.innerHTML = "<div></div>";
    el.appendChild(prog);
    el.addEventListener("click", () => seek(c.start));
    c.el = el;
    box.appendChild(el);
  });
  const bar = $("bar");
  cues.forEach((c) => {
    const tick = document.createElement("div");
    tick.className = "tick";
    tick.style.left = `${(c.start / total) * 100}%`;
    bar.appendChild(tick);
  });
}

// The line being read, or in a gap, the one coming up.
function currentIndex() {
  for (let i = 0; i < cues.length; i++) if (t < cues[i].end) return i;
  return cues.length - 1;
}

function render() {
  $("now").textContent = fmt(Math.min(t, total));
  $("fill").style.width = `${Math.min(100, (t / total) * 100)}%`;
  const i = currentIndex(), c = cues[i];
  const inGap = t < c.start;
  cues.forEach((q, k) => {
    q.el.classList.toggle("current", k === i);
    q.el.classList.toggle("near", Math.abs(k - i) === 1);
    q.el.classList.toggle("done", k < i);
    if (k === i) {
      q.el.querySelectorAll(".w").forEach((w, j) => w.classList.toggle("lit", t >= q.at[j]));
      const p = Math.max(0, Math.min(1, (t - q.start) / (q.end - q.start)));
      q.el.querySelector(".progress div").style.width = `${p * 100}%`;
    }
  });
  // Keep the current line a third of the way down. offsetTop is measured
  // from <main> and ignores the transform, so it's stable.
  const main = $("lines").parentElement;
  $("lines").style.transform = `translateY(${main.clientHeight * 0.33 - c.el.offsetTop}px)`;
  $("picture").textContent = c.picture;
  $("onscreen").textContent = c.onscreen;
  $("next").innerHTML = inGap
    ? `Breathe · line in <b>${(c.start - t).toFixed(1)} s</b>`
    : i + 1 < cues.length ? `Next line in <b>${(cues[i + 1].start - t).toFixed(1)} s</b>` : t >= total ? "End" : "Last line";
  // Segment indicator: which third we're in and the recorded/total count.
  if (segStarts.length) {
    const recorded = Object.keys(clips).length;
    $("seg").innerHTML = `Seg <b>${segOf(i) + 1}/${segStarts.length}</b> · line <b>${i + 1}/${cues.length}</b> · rec <b>${recorded}/${cues.length}</b>`;
  }
  const st = $("state");
  const recing = (recorder && recorder.state === "recording") || (recordMode && running && recIndex >= 0);
  st.className = "state" + (recing ? " rec" : running ? " live" : "");
  if (counting !== null) st.textContent = recordMode ? "Get ready to read this line" : "Get ready";
  else if (recing) st.textContent = "● Recording this line";
  else if (recordMode) st.textContent = clips[i] ? "Recorded · Space to re-take · → next" : "Record mode · Space to record this line";
  else st.textContent = running ? "Reading" : t >= total ? "Done · R to restart" : t > 0 ? "Paused · Space to resume" : "Ready · Space to start";
  $("play").textContent = (running || counting !== null)
    ? (recordMode ? "Stop" : "Pause")
    : recordMode ? (clips[i] ? "Re-record" : "Record line") : t > 0 && t < total ? "Resume" : "Start";
}

function tick(now) {
  if (running) {
    t += (now - lastFrame) / 1000;
    if (recordMode && recIndex >= 0) {
      // A take plays only over its own line's window, then stops.
      const c = cues[recIndex];
      if (t >= c.end) { t = c.end; finishTake(); }
    } else if (t >= total) {
      t = total; running = false;
    }
  }
  lastFrame = now;
  render();
  requestAnimationFrame(tick);
}

function start() {
  if (recordMode) return startTake();
  if (t >= total) t = 0;
  if (!countIn) { running = true; lastFrame = performance.now(); return; }
  runCountIn(() => { running = true; lastFrame = performance.now(); });
}
function stop() {
  running = false;
  if (counting !== null) { clearInterval(counting); counting = null; $("count").classList.remove("on"); }
  if (recordMode && recorder && recorder.state === "recording") cancelTake();
}
const toggle = () => (running || counting !== null ? stop() : start());

// Run the 1-2-3 count-in, then call done().
function runCountIn(done) {
  if (!countIn) return done();
  let n = COUNT_IN_S;
  const show = () => { $("count").textContent = n; $("count").classList.add("on"); };
  show();
  counting = setInterval(() => {
    n -= 1;
    if (n > 0) return show();
    clearInterval(counting); counting = null;
    $("count").classList.remove("on");
    done();
  }, 1000);
}

// --- Line-by-line take flow ------------------------------------------------
async function ensureMic() {
  if (mediaStream) return true;
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  } catch (err) {
    alert("Couldn't open the microphone: " + err.message + "\n\nServe the prompter over http://127.0.0.1 (make prompter) and allow mic access.");
    return false;
  }
  for (const m of ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"]) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) { recMime = m; break; }
  }
  return true;
}

// Begin recording the current line: count-in, snap to its start, record over
// its cue window. tick() calls finishTake() when the line's end is reached.
async function startTake() {
  const i = currentIndex();
  if (!(await ensureMic())) return;
  seekSilently(cues[i].start);
  runCountIn(() => {
    recIndex = i;
    recChunks = [];
    recorder = new MediaRecorder(mediaStream, { mimeType: recMime });
    recorder.ondataavailable = (e) => { if (e.data && e.data.size) recChunks.push(e.data); };
    recorder.onstop = saveTakeChunks;
    recorder.start();
    document.body.classList.add("recording");
    running = true; lastFrame = performance.now();
  });
}

// Stop and keep the take (called at line end).
function finishTake() {
  running = false;
  if (recorder && recorder.state === "recording") recorder.stop(); // triggers saveTakeChunks
  else afterTake();
}

// Stop and discard the take (manual pause mid-line).
function cancelTake() {
  const r = recorder; recorder = null; recIndex = -1;
  document.body.classList.remove("recording");
  if (r && r.state === "recording") { r.onstop = null; r.stop(); }
}

function saveTakeChunks() {
  document.body.classList.remove("recording");
  if (recIndex >= 0 && recChunks.length) {
    const blob = new Blob(recChunks, { type: recMime });
    const c = cues[recIndex];
    clips[recIndex] = { blob, dur: c.end - c.start };
    cues[recIndex].el.classList.add("has-clip");
  }
  recorder = null;
  afterTake();
}

// After a take: advance to the next line, pausing at a third boundary.
function afterTake() {
  const done = recIndex;
  recIndex = -1;
  const next = done + 1;
  if (next >= cues.length) { showBanner("All lines recorded", "Save clips, then run stitch_vo.py to render the 3:00 track."); seekSilently(cues[done].start); return; }
  seekSilently(cues[next].start);
  if (segOf(next) !== segOf(done)) {
    const seg = segOf(next);
    showBanner(`Segment ${seg + 1} of ${segStarts.length}`, `${countLeft(seg)} lines coming up · Space (or ● Record) to continue`);
  }
}

const countLeft = (seg) => segLastIndex(seg) - segStarts[seg] + 1;

function showBanner(title, body) {
  $("bannerTitle").textContent = title;
  $("bannerBody").textContent = body;
  $("banner").classList.add("on");
}
function hideBanner() { $("banner").classList.remove("on"); }

// Move the clock without the record-mode auto-start side effects.
function seekSilently(s) { t = Math.max(0, Math.min(total, s)); render(); }

async function toggleRecordMode() {
  recordMode = !recordMode;
  stop();
  if (recordMode) {
    await ensureMic();
    const i = currentIndex();
    seekSilently(cues[i].start);
    showBanner("Record mode", "Read one line per take. Space starts a 1-2-3 count-in, the line records, then it parks on the next line. ← → to re-take any line. Breaks fall between thirds.");
  } else {
    hideBanner();
  }
  $("rec").setAttribute("aria-pressed", String(recordMode));
  $("rec").textContent = recordMode ? "● Record: on" : "● Record: off";
  render();
}

// Download every recorded clip, named by cue, plus a manifest for the stitcher.
// Browsers block a rapid burst of downloads, so we space them out and save the
// manifest first (the important one). A "Save next" button saves one at a time
// as a guaranteed fallback.
let savedCount = 0;
function clipName(i) {
  const ext = recMime.includes("mp4") ? "m4a" : "webm";
  return `vo_${String(i).padStart(2, "0")}_${cues[i].start.toFixed(0)}.${ext}`;
}
function download(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function manifestBlob() {
  const ext = recMime.includes("mp4") ? "m4a" : "webm";
  const idxs = Object.keys(clips).map(Number).sort((a, b) => a - b);
  const manifest = { total, mime: recMime, ext, clips: idxs.map((i) => ({ index: i, file: clipName(i), start: cues[i].start, end: cues[i].end, line: cues[i].line })) };
  return new Blob([JSON.stringify(manifest, null, 2)], { type: "application/json" });
}
async function saveClips() {
  const idxs = Object.keys(clips).map(Number).sort((a, b) => a - b);
  if (!idxs.length) { alert("No takes recorded yet. Turn on Record and read some lines first."); return; }
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  download(manifestBlob(), "manifest.json");          // save the manifest first
  for (let k = 0; k < idxs.length; k++) {
    const i = idxs[k];
    $("save").textContent = `Saving ${k + 1}/${idxs.length}…`;
    download(clips[i].blob, clipName(i));
    await sleep(450);                                  // spaced out so the browser doesn't block the burst
  }
  savedCount = idxs.length;
  $("save").textContent = `Saved ${idxs.length} ✓`;
  setTimeout(() => ($("save").textContent = "Save clips"), 2500);
}
// Save exactly one not-yet-saved clip per click (guaranteed by the browser).
function saveNext() {
  const idxs = Object.keys(clips).map(Number).sort((a, b) => a - b);
  if (!idxs.length) { alert("No takes recorded yet."); return; }
  if (savedCount === 0) download(manifestBlob(), "manifest.json");
  if (savedCount >= idxs.length) { alert("All clips saved. (If some are missing, check your downloads folder.)"); return; }
  const i = idxs[savedCount];
  download(clips[i].blob, clipName(i));
  savedCount += 1;
  $("saveNext").textContent = savedCount >= idxs.length ? "All saved ✓" : `Save next (${savedCount}/${idxs.length})`;
}
function seek(s) { stop(); hideBanner(); t = Math.max(0, Math.min(total, s)); render(); }
function step(d) {
  const i = currentIndex();
  // ← from the middle of a line goes back to its start; again goes to the line before.
  const target = d < 0 && t > cues[i].start + 0.3 ? i : Math.max(0, Math.min(cues.length - 1, i + d));
  seek(cues[target].start);
}

function srt() {
  const ts = (s) => {
    const ms = Math.round(s * 1000), h = Math.floor(ms / 3600000), m = Math.floor(ms / 60000) % 60, sec = Math.floor(ms / 1000) % 60;
    return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")},${String(ms % 1000).padStart(3, "0")}`;
  };
  const body = cues.map((c, i) => `${i + 1}\n${ts(c.start)} --> ${ts(c.end)}\n${c.line}\n`).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([body], { type: "application/x-subrip" }));
  a.download = "fireline-demo.srt";
  a.click();
  URL.revokeObjectURL(a.href);
}

function size(d) {
  const cur = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--size"));
  document.documentElement.style.setProperty("--size", `${Math.max(24, Math.min(96, cur + d))}px`);
}

document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.code === "Space") { e.preventDefault(); hideBanner(); toggle(); }
  else if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "ArrowRight") step(1);
  else if (e.key === "r" || e.key === "R" || e.key === "Home") seek(0);
  else if (e.key === "+" || e.key === "=") size(4);
  else if (e.key === "-" || e.key === "_") size(-4);
  else if (e.key === "c" || e.key === "C") { countIn = !countIn; $("state").textContent = `Count-in ${countIn ? "on" : "off"}`; }
  else if (e.key === "k" || e.key === "K") toggleRecordMode();
});
$("play").addEventListener("click", () => { hideBanner(); toggle(); });
$("prev").addEventListener("click", () => step(-1));
$("nextBtn").addEventListener("click", () => step(1));
$("rec").addEventListener("click", toggleRecordMode);
$("save").addEventListener("click", saveClips);
$("srt").addEventListener("click", srt);
$("bar").addEventListener("click", (e) => {
  const r = e.currentTarget.getBoundingClientRect();
  seek(((e.clientX - r.left) / r.width) * total);
});

fetch("SCRIPT.md", { cache: "no-store" })
  .then((r) => { if (!r.ok) throw new Error(`SCRIPT.md: HTTP ${r.status}`); return r.text(); })
  .then((md) => {
    cues = parse(md);
    if (!cues.length) throw new Error("the Read-along table has no rows");
    total = cues[cues.length - 1].end;
    segStarts = computeSegments();
    $("total").textContent = fmt(total, false);
    build();
    requestAnimationFrame((now) => { lastFrame = now; tick(now); });
  })
  .catch((err) => {
    document.querySelector("main").innerHTML =
      `<div class="error">Couldn't load the script (${err.message}).<br><br>Run <code>make prompter</code> from the repo root and open the link it prints.</div>`;
  });
</script>
</body>
</html>
