[project]
name = "fireline-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pydantic>=2.14.1",
    "websockets>=17.3",
]

[project.optional-dependencies]
# The learned fire emulator (#113): instant forecast previews and crew-spot
# screening. Without it the engine uses Monte Carlo only.
ml = [
    "mlx>=0.32.4 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
