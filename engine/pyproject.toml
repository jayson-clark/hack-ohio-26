[project]
name = "firewatch-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pydantic>=2.14.1",
    "websockets>=17.3",
]

[project.optional-dependencies]
voice = [
    "mlx-whisper>=0.4.3 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "sounddevice>=0.5.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
